<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Book Library - JavWar</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <header>
        <a href="../index.html" class="logo-link">
            <div>
            <img class ="logo"src="../assets/images/logo.png" alt="MBook Logo Icon" height="40">
                <span>MBoo</span>
            </div>
        </a>

        <nav>
            <a href="add-book.html">
                <button class="add-button" aria-label="Add new book review">+</button>
            </a>
        </nav>
    </header>

    <main>
        <div class="book-details-container">

            <div class="book-poster">
                <img src="https://placehold.co/380x570" alt="Poster for JavWar">
            </div>

            <div class="book-details-info">
                <h1 class="book-title">JavWar</h1>

                <div class="book-section">
                    <p><strong>Read on:</strong> 06/10/2025</p>
                </div>

                <div class="book-section rating-details">
                    <p><strong>Rating:</strong></p>
                    <div class="rating" aria-hidden="true">
                        <span>★</span><span>★</span><span>★</span><span>★</span><span class="star-empty">★</span>
                    </div>
                    <span class="rating-text">4 out of 5 stars</span>
                </div>

                <div class="book-section">
                    <p class="review-title"><strong>Review:</strong></p>
                    <p>An exemplary tale of programming virtue and determination in Java. The plot twists were as unexpected as
                        a segmentation fault. A must-watch for every developer.</p>
                </div>
            </div>
        </div>
    </main>


    <footer>
        <p>&copy; 2026 MBook &ndash; My Review Book</p>
    </footer>
</body>

</html>
